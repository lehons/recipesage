# Overlay proxy. Everything not under /overlay/ goes to the stock
# recipesage_proxy container; HTML responses get the overlay tags injected.

server {
  listen 80 default_server;
  client_max_body_size 1G;

  # recipesage_proxy is resolved at request time so this container starts
  # even if the RecipeSage stack is down.
  resolver 127.0.0.11 valid=30s;
  set $recipesage http://recipesage_proxy:80;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  # sub_filter needs an uncompressed upstream body.
  proxy_set_header Accept-Encoding "";

  sub_filter '</head>' '<link rel="stylesheet" href="/overlay/inject/overlay.css"><script type="module" src="/overlay/inject/overlay.js"></script></head>';
  sub_filter_once on;

  # Overlay static files (bind-mounted from the git checkout).
  location /overlay/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location = /overlay/config.json {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store";
  }

  # Realtime websocket: pass straight through.
  location /grip/ws {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_connect_timeout 1h;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;
    proxy_pass $recipesage;
  }

  # App deep links (no file extension). The stock layout 404s on a hard load
  # of e.g. /app/list/main; fall back to the app's index so Angular routes it.
  location ~ ^/app/[^.]*$ {
    proxy_pass $recipesage;
    proxy_intercept_errors on;
    error_page 404 = @app_index;
  }

  location @app_index {
    rewrite ^ / break;
    proxy_pass $recipesage;
  }

  location / {
    proxy_pass $recipesage;
  }
}
